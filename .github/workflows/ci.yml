name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      # gofmt recurses into directories, so the vendored dependencies have to
      # be excluded by listing files: they are third-party code, formatted for
      # whichever Go version produced them, and not ours to reformat.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -timeout 300s

      # The transport and server are concurrent throughout, so the race
      # detector is the check that actually matters here.
      - name: Test with the race detector
        run: go test ./... -race -timeout 900s
