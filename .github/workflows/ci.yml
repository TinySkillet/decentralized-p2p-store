name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Dependencies are no longer vendored, so this needs the network. It is a
      # separate step from Build so that a proxy outage reads as a fetch
      # failure rather than a compile error.
      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -timeout 300s

      # The transport and server are concurrent throughout, so the race
      # detector is the check that actually matters here.
      - name: Test with the race detector
        run: go test ./... -race -timeout 900s
